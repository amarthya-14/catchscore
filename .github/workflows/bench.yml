# Scores merged AI-agent PRs from public repositories. Each PR runs in its own disposable runner,
# because scoring runs that project's tests. The runners get read-only access and no secrets.
name: bench

on:
  workflow_dispatch:
    inputs:
      prs:
        description: JSON list of PRs to score (made by bench/select.py)
        default: bench/pilot.json

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.read.outputs.prs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: read
        run: echo "prs=$(jq -c . '${{ inputs.prs }}')" >> "$GITHUB_OUTPUT"

  score:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.prs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: catchscore
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: astral-sh/setup-uv@v6
      - name: Score ${{ matrix.pr.repo }}#${{ matrix.pr.pr }}
        env:
          CATCHSCORE_SRC: ${{ github.workspace }}/catchscore
          # CPU builds of PyTorch: the CUDA ones are several GB and runners have no GPU anyway.
          UV_TORCH_BACKEND: cpu
          GITHUB_TOKEN: ""
        run: |
          # /tmp on these runners is a small separate filesystem with a quota; installs, catchscore's
          # scratch copies and even the result file ran out of space there. Use the main disk.
          export TMPDIR="$RUNNER_TEMP/tmp" && mkdir -p "$TMPDIR"
          mkdir -p out
          bash catchscore/bench/score_pr.sh "${{ matrix.pr.repo }}" "${{ matrix.pr.pr }}" \
            "${{ matrix.pr.head }}" "${{ matrix.pr.base }}" "$PWD/out/result.json"
          cat out/result.json
      - id: name
        if: always()
        run: echo "name=$(echo '${{ matrix.pr.repo }}-${{ matrix.pr.pr }}' | tr '/' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ steps.name.outputs.name }}
          path: out/result.json
          if-no-files-found: ignore

  collect:
    needs: score
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - run: |
          find results -name result.json -exec cat {} + | jq -c . > all.jsonl
          {
            echo "## Benchmark results"
            echo
            # Scored: bugs were injected and at least one test really ran (not all skipped).
            S='map(select(.injected > 0 and ((.baseline_tests.passed // 1) > 0)))'
            echo "Scored: $(jq -s "$S | length" all.jsonl) of $(wc -l < all.jsonl) PRs"
            echo
            echo "Not scored, by stage:"
            jq -rs 'map(select(.skipped)) | group_by(.skipped)[] | "- \(.[0].skipped): \(length)"' all.jsonl
            echo "- no mutable changed lines: $(jq -s 'map(select(.injected == 0)) | length' all.jsonl)"
            echo "- every test skipped: $(jq -s 'map(select(.injected > 0 and .baseline_tests.passed == 0)) | length' all.jsonl)"
            echo
            echo "Bugs caught across scored PRs: $(jq -s "$S | (map(.caught) | add // 0 | tostring) + \" of \" + (map(.injected) | add // 0 | tostring)" all.jsonl)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: all-results
          path: all.jsonl
